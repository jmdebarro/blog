# Builds the Eleventy site and copies it to the VPS on every push to main.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_KEY          private SSH key whose public half is in ~ubuntu/.ssh/authorized_keys on the VPS
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -p 49153 135.148.43.61
name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

concurrency:
  group: deploy-blog
  cancel-in-progress: true

env:
  DEPLOY_HOST: 135.148.43.61
  DEPLOY_PORT: "49153"
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /srv/blog/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npx @11ty/eleventy

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Show which server keys GitHub will trust (public fingerprints only)
          if ! ssh-keygen -lf ~/.ssh/known_hosts; then
            echo "::error::DEPLOY_KNOWN_HOSTS is empty or invalid. Set it from: ssh-keyscan -p $DEPLOY_PORT $DEPLOY_HOST"
            exit 1
          fi
          grep -q "\[$DEPLOY_HOST\]:$DEPLOY_PORT" ~/.ssh/known_hosts || echo "::warning::DEPLOY_KNOWN_HOSTS has no entry for [$DEPLOY_HOST]:$DEPLOY_PORT. Was ssh-keyscan run with -p $DEPLOY_PORT?"

      - name: Upload to the VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            _site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
